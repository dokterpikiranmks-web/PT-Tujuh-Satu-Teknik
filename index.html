  <!-- External Link & Accessibility Helper -->
  <script>
    (function(){
      function enhanceLink(a){
        var h = a.getAttribute("href");
        if(!h) return;
        try{
          var u = new URL(h, document.baseURI);
          if(((u.protocol === "http:" || u.protocol === "https:") && u.host !== location.host) || u.protocol === "mailto:" || u.protocol === "tel:"){
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
        }catch(e){}
      }
      function initLinks(){
        document.querySelectorAll("a[href]").forEach(enhanceLink);
      }
      if(document.readyState !== "loading"){
        initLinks();
      } else {
        document.addEventListener("DOMContentLoaded", initLinks);
      }
      document.addEventListener("click", function(e){
        var t = e.target.closest("a[href]");
        if(t) enhanceLink(t);
      });
    })();
  </script>
